<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Road to Thailand League</title><style>:root{--navy:#0b2d5b;--blue:#17467c;--gold:#cda434;--red:#b74040;--bg:#f4f7fb;--line:#dfe6ef;--ink:#14233b}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Thai",sans-serif;background:var(--bg);color:var(--ink)}header{background:linear-gradient(135deg,var(--navy),var(--blue));color:#fff;padding:24px}header h1{margin:0 0 6px}header p{margin:0;color:#dce8f7}main{max-width:1400px;margin:auto;padding:18px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:16px;box-shadow:0 6px 20px rgba(13,45,90,.06)}button,a.btn{border:0;border-radius:9px;padding:10px 14px;font-weight:700;cursor:pointer;text-decoration:none;display:inline-block;background:var(--navy);color:#fff}.ghost{background:#eef4fb!important;color:var(--navy)!important}.danger{background:#fff0f0!important;color:var(--red)!important}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.groups{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.group{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fbfcfe}.group h3{margin:0 0 8px;color:var(--navy)}input{border:1px solid #ccd7e5;border-radius:8px;padding:7px;width:100%}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px;border-bottom:1px solid var(--line);text-align:center}th{background:#f7f9fc}td.team{text-align:left;font-weight:700}.qual{background:#fff8d9}.small{font-size:12px;color:#6b7890}.match{border:1px solid var(--line);border-radius:10px;padding:8px;margin:7px 0}.winner{font-weight:800;color:#137a56}@media(max-width:900px){.groups{grid-template-columns:1fr 1fr}}@media(max-width:600px){.groups{grid-template-columns:1fr}}</style></head><body><header><h1>Road to Thailand League — Mockup</h1><p>8 สาย • พบกันหมดในสาย • ชนะ 2 คะแนน / แพ้ 0 คะแนน • คัด 16 ทีม</p></header><main><div class="card toolbar"><a class="btn ghost" href="index.html">← หน้ารวม</a><button onclick="sim()">🎲 จำลองผล</button><button class="danger" onclick="location.reload()">ล้างผล</button></div><div class="card"><h2>รอบแบ่งสาย A–H</h2><div class="small">ตัวอย่าง 32 ทีม แบ่ง 8 สาย สายละ 4 ทีม • แก้ชื่อทีมได้</div><div id="groups" class="groups" style="margin-top:12px"></div></div><div class="card"><h2>16 ทีมผ่านเข้ารอบ Knockout Circuit</h2><div id="q"></div></div></main><script>const L="ABCDEFGH".split("");let G=L.map((x,g)=>Array.from({length:4},(_,i)=>({name:"Team "+(g*4+i+1),p:0,w:0,l:0,sd:0,pd:0})));function play(g){g.forEach(t=>Object.assign(t,{p:0,w:0,l:0,sd:0,pd:0}));for(let i=0;i<4;i++)for(let j=i+1;j<4;j++){let a=g[i],b=g[j],w=Math.random()<.5?a:b,l=w===a?b:a,d=1+Math.floor(Math.random()*15);w.w++;l.l++;w.p+=2;w.sd++;l.sd--;w.pd+=d;l.pd-=d}}function s(g){return [...g].sort((a,b)=>b.p-a.p||b.sd-a.sd||b.pd-a.pd)}function render(){groups.innerHTML=G.map((g,gi)=>'<div class="group"><h3>สาย '+L[gi]+'</h3>'+g.map((t,i)=>'<input value="'+t.name+'" onchange="G['+gi+']['+i+'].name=this.value;render()" style="margin-bottom:5px">').join("")+'<table><tr><th>#</th><th>ทีม</th><th>W</th><th>L</th><th>Pts</th><th>SD</th><th>PD</th></tr>'+s(g).map((t,i)=>'<tr class="'+(i<2?'qual':'')+'"><td>'+(i+1)+'</td><td class="team">'+t.name+'</td><td>'+t.w+'</td><td>'+t.l+'</td><td><b>'+t.p+'</b></td><td>'+t.sd+'</td><td>'+t.pd+'</td></tr>').join("")+'</table></div>').join("");let z=[];G.forEach((g,gi)=>s(g).slice(0,2).forEach((t,i)=>z.push([t.name,L[gi],i+1])));q.innerHTML='<table><tr><th>#</th><th>ทีม</th><th>สิทธิ์</th></tr>'+z.map((x,i)=>'<tr><td>'+(i+1)+'</td><td class="team">'+x[0]+'</td><td>สาย '+x[1]+' อันดับ '+x[2]+'</td></tr>').join("")+'</table>'}function sim(){G.forEach(play);render()}render();</script></body></html>
